openapi: 3.0.4
info:
  title: HTTP Status Code Lookup
  description: >-
    HTTP Status Code Lookup decodes any HTTP status code by returning its
    standard name and detailed description. Provide a numeric code to inspect
    its meaning and response behavior across standard ranges, and add
    details=true for a link to the defining RFC section, plus on paid plans its
    retry and caching behavior and the headers that go with it.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/httpstatuslookup:
    get:
      summary: HTTP Status Code Lookup
      description: >-
        Get information about an HTTP status code, optionally with its RFC
        reference, retry and caching behavior, and related headers
      operationId: httpstatuslookup
      parameters:
        - name: code
          in: query
          schema:
            type: integer
          required: true
          description: HTTP status code to lookup
          example: 404
        - name: details
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Also return the registry name, defining RFC section and link, retry
            and default-caching flags, and related headers
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  code: 404
                  name: Not Found
                  description: The requested resource could not be found
                  category: Client Error
                  is_error: true
                  is_success: false
                  is_redirect: false
                  is_informational: false
                  registry_name: Not Found
                  spec: RFC 9110, Section 15.5.5
                  spec_url: https://www.rfc-editor.org/rfc/rfc9110#section-15.5.5
                  is_retryable: false
                  is_cacheable_by_default: true
                  related_headers: []
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
